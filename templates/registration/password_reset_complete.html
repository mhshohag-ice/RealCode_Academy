{% extends "core/base.html" %}
{% block title %}Password Reset Complete — RealCode Academy{% endblock %}
{% block content %}
<div class="auth-split">
  {% include "partials/auth_brand_panel.html" %}

  <div class="auth-form-panel">
    <div class="rc-auth-card text-center">
      <div class="rc-auth-icon" style="margin:0 auto 20px; background:linear-gradient(135deg, var(--success), var(--accent));">
        <i data-lucide="check-circle-2" width="24"></i>
      </div>
      <h2 class="mb-2">Password updated</h2>
      <p class="text-secondary mb-4">Your password has been changed. You can log in now.</p>
      <a href="{{ login_url }}" class="btn-rc btn-rc-primary">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
